[package]
name = "meow-back-office"
version = "0.1.0"
description = "Back office for Meow"
authors = ["Meow"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"

# The OS credential store. One of the three reasons this is a desktop app at
# all: a back-office token in web storage is one XSS away from being someone
# else's, and the browser cannot offer anything better.
#
# Split per target because each platform needs its own backend feature, and
# enabling the others pulls in dependencies that do not build here.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

# Auto-update. Desktop-only by target, because there is no mobile build of
# this shell and the plugin does not compile for one.
#
# The signature it checks is minisign, generated by `tauri signer`, and is a
# different thing from an OS code-signing certificate: this one proves an update
# came from us, that one stops Windows warning the user before they install it.
# Both are needed, for different reasons.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
