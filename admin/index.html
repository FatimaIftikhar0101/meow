<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meow back office</title>
    <!--
      Stamps the resolved scheme on <html> before anything paints.

      This has to be inline and blocking. React cannot do it: by the time the
      bundle has parsed and the first effect has run, the browser has already
      painted a white page, and someone working in dark mode gets a full-screen
      flash of white every time they open the panel or hit reload.

      The key and the three preference values are duplicated from
      src/lib/theme.tsx on purpose — this runs before any module exists to
      import from. If either side changes, change both.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('meow.admin.theme');
          var scheme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = scheme;
        } catch (e) {
          // Private mode can refuse localStorage. Light is the default and the
          // app still works; it is not worth failing the page load over.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
