services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meow
      POSTGRES_PASSWORD: meow_dev_password
      POSTGRES_DB: meow_dev
    ports:
      - "5432:5432"
    volumes:
      - meow_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  meow_pg_data:
