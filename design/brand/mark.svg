<!--
  The Meow mark. This file is the source of truth for every icon in the repo.

  Transcribed from mobile/components/CatMark.tsx, which was itself taken from
  web/app/_components/Brand.tsx unchanged — same 32x32 viewBox, same silhouette,
  same gold gradient, same near-black pupils. Nothing here is redrawn; if the
  mark ever changes, it changes in the component and gets copied back to here,
  and `node design/brand/build-icons.mjs` regenerates everything downstream.

  Deliberately has no ground of its own. Gold measures 1.97:1 on white, which is
  below even the 3:1 floor for a graphic, so the mark is never placed on a light
  surface bare — see roundel.svg for the lockup that carries its own dark disc.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="meow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1C2"/>
      <stop offset="60%" stop-color="#E0B259"/>
      <stop offset="100%" stop-color="#9A6D18"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="none" stroke="url(#meow-gold)" stroke-width="1.5"/>
  <path
    d="M 11 11 L 13 8 L 14 13 L 18 13 L 19 8 L 21 11 Q 23 16 21 20 Q 16 23 11 20 Q 9 16 11 11 Z"
    fill="url(#meow-gold)"/>
  <circle cx="13.5" cy="15" r="0.9" fill="#07090F"/>
  <circle cx="18.5" cy="15" r="0.9" fill="#07090F"/>
</svg>
